<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><!-- CSS-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet"> <!-- Google Fonts linked-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- Bootstrap linked-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><!--bootstrap js-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
</head>
<body class="loginpage">

    <div class="d-flex flex-column gap-3 loginbox">
        <h1 class="header"><b>Welcome Back</b></h1>
        <br>
        <br>
        
        <div class="form-floating mb-3 ">
            <input type="email" class="form-control rounded-4 px-5 " id="floatingInput" placeholder="name@example.com">
            <label for="floatingInput">Email address</label>
        </div>
        <div class="form-floating">
            <input type="password" class="form-control rounded-4 px-5" id="floatingPassword" placeholder="Password">
            <label for="floatingPassword">Password</label>
        </div>

        <div class="d-grid gap-2 col-3 mx-auto">
            <button class="btn btn-gradient rounded-4" type="button"><b class="text-light fs-5">Login</b></button>
        </div>
        <br>
        <h6 class="text-light " style="font-family: Arial, sans-serif;">No account? 
            <a href="{{url_for('register')}}" type="button" class="btn btn-primary position-relative">
                Register

                <span class="badge text-bg-secondary position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle">
                    <span class="visually-hidden">
                        
                    </span>
                    
                </span>
            </a>
        </h6>


    </div>
    
</body>
</html>
