<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><!-- CSS-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet"> <!-- Google Fonts linked-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- Bootstrap linked-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><!--bootstrap js-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body class="registerpage">
    

    <div class="d-flex flex-column gap-3 registerbox">
        <h1 class="header"><b>Create Account</b></h1>
        <br>
        <br>
        <form method="POST" action="{{url_for('register')}}">
            
            <div class="form-floating mb-3 ">
                <input type="text" class="form-control rounded-4 px-5 " name="name" id="floatingInput" placeholder="John Doe">
                <label for="floatingInput">Name</label>
            </div>
            <div class="form-floating mb-3 ">
                <input type="email" class="form-control rounded-4 px-5 " name="email" id="floatingInput" placeholder="name@example.com">
                <label for="floatingInput">Email</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control rounded-4 px-5" name="password" id="floatingPassword" placeholder="Password">
                <label for="floatingPassword">Password</label>
            </div>

            <br>

            <div class="d-grid gap-2 col-3 mx-auto">
                <button class="btn btn-gradient2 rounded-4" type="submit"><b class="text-light fs-5">Register</b></button>
            </div>
        </form>

        <h6 class="text-light " style="font-family: Arial, sans-serif;">Staff can login directly 
            <a href="{{url_for('login')}}" type="button" class="btn btn-primary position-relative">
                Login

                <span class="badge text-bg-secondary position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle">
                    <span class="visually-hidden">
                        
                    </span>
                    
                </span>
            </a>
        </h6>
    </div>
    
</body>
</html>
